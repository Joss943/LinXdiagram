[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linxdiagram"
dynamic = ["version"]
description = "Éditeur de diagrammes compatible Visio pour Linux, Windows et macOS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Josselin Lerendu" }]
keywords = ["diagramme", "visio", "vsdx", "organigramme", "bpmn", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "PyQt6>=6.5",
    # Windows et macOS : chiffrement sans dépendre d'une libcrypto système.
    "cryptography>=41; sys_platform != 'linux'",
]

[project.urls]
Homepage = "https://joss943.github.io/LinXdiagram/"
Source = "https://github.com/Joss943/LinXdiagram"

[project.gui-scripts]
linxdiagram = "linxdiagram.app:main"

[tool.setuptools]
packages = ["linxdiagram"]

[tool.setuptools.dynamic]
version = { attr = "linxdiagram.__version__" }
